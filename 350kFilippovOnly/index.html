<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div id="header-input">
            <input id="card-search" type="search" placeholder="что ищем?">
        </div>
        <div id="theme-btn-div"><button id="theme-btn"><img src="images/icon-menu.png" alt=""></button></div>
    </header>
    <div id="main-content">
        <div id="sort-block">  
            <div id="sort-div">
                <input name="sort" type="radio" id="price-des" class="sort">
                по цене убывание
            </div>
            <div id="sort-div">
                <input name="sort" type="radio" id="price-inc" class="sort">
                по цене возрастание
            </div>
            <div id="sort-div">
                <input name="sort" type="radio" id="alphabet-inc" class="sort">
                по алфавиту А-Я
            </div>
            <div id="sort-div">
                <input name="sort" type="radio" id="alphabet-des" class="sort">
                по алфавиту Я-А
            </div>
        </div>
        <div id="filtrs">
            <div class="filtr-div">
                <input name="filtr" type="radio" id="vegetables" class="filtr">
                овощи
            </div>
            <div class="filtr-div">
                <input name="filtr" type="radio" id="fruit" class="filtr">
                фркуты
            </div>
            <div class="filtr-div">
                <input name="filtr" type="radio" id="meat" class="filtr">
                мясо
            </div>
            <div class="filtr-div">
                <input name="filtr" type="radio" id="fish" class="filtr">
                рыба
            </div>
            <div class="filtr-div">
                <input name="filtr" type="radio" id="all" class="filtr" checked>
                всё
            </div>
        </div>
        <div id="content"></div>
    </div>
    <script src="scripts/script.js"></script>
    

</body>
</html>

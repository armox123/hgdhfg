<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Document</title>
</head>
<body>
    <button id="filtr-btn"><img src="images/icon-menu.png" alt=""></button>
    <input id="card-search" type="search" placeholder="что ищем?">
    <div id="main-content">
        <div id="filtrs">
            <div class="filtr-div">
            <input name="filtr" type="radio" id="vegetables">
            овощи
            </div>
            <div class="filtr-div">
            <input name="filtr" type="radio" id="fruit">
            фркуты
            </div>
            <div class="filtr-div">
            <input name="filtr" type="radio" id="meat">
            мясо
            </div>
            <div class="filtr-div">
            <input name="filtr" type="radio" id="fish">
            рыба
            </div>
            <div class="filtr-div">
            <input name="filtr" type="radio" id="all" checked>
            всё
            </div>
        </div>
        <div id="content"></div>
    </div>
    <script src="scripts/script.js"></script>
    

</body>
</html>
